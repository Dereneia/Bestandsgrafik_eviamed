<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="43000">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labor-Monitor Berlin: Status & Leistung</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --primary-dark: #1e293b;
            --accent-blue: #3b82f6;
            --danger-red: #8b0000;
            --bg-light: #cbd5e1;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-light); 
            display: flex; 
            flex-direction: row; 
            flex-wrap: wrap; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh;
            margin: 0;
            gap: 20px;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        .card { 
            background: white; 
            padding: 20px; 
            border-radius: 20px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.15); 
            text-align: center; 
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            flex: 1 1 400px; /* Basisbreite leicht auf 400px reduziert für 3 Karten nebeneinander */
            max-width: 700px;
            margin-bottom: 40px; 
        }

        h2 { color: var(--primary-dark); margin: 0 0 5px 0; font-size: 1.6em; }
        .subtitle { color: #64748b; margin-bottom: 20px; font-weight: 600; font-size: 1em; }

        /* --- THERMOMETER STYLE (Responsive) --- */
        .thermo-layout { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 400px; 
            position: relative; 
            margin: 20px 0;
            width: 100%;
        }
         
        .scale { 
            display: flex; 
            flex-direction: column-reverse; 
            justify-content: space-between; 
            height: 100%; 
            margin-right: 15px; 
            font-weight: bold; 
            color: #444; 
            border-right: 3px solid #ddd; 
            padding-right: 10px; 
            font-family: monospace; 
            font-size: 1em; 
        }

        .thermo-body { 
            width: 50px; 
            height: 100%; 
            background: #eee; 
            border-radius: 30px; 
            border: 4px solid #fff; 
            box-shadow: inset 0 0 10px rgba(0,0,0,0.15), 0 5px 15px rgba(0,0,0,0.2);
            position: relative; 
            overflow: hidden; 
        }

        .color-layers { position: absolute; bottom: 0; width: 100%; height: 100%; display: flex; flex-direction: column-reverse; }

        .thermo-gloss { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: linear-gradient(90deg, rgba(255,255,255,0.3) 20%, rgba(255,255,255,0) 50%, rgba(0,0,0,0.05) 90%);
            z-index: 2; pointer-events: none;
        }

        .indicator-arrow {
            position: absolute; 
            left: 55%; 
            width: 100px; 
            height: 40px;
            background: white; 
            border-radius: 8px; 
            box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            font-size: 1.1em;
            transition: bottom 2s ease-in-out; 
            z-index: 5; 
            color: var(--primary-dark);
        }
        .indicator-arrow::before {
            content: ''; position: absolute; left: -15px; top: 10px;
            border-top: 10px solid transparent; border-bottom: 10px solid transparent;
            border-right: 15px solid white;
        }

        /* --- CHART & BADGES --- */
        .chart-container { width: 100%; position: relative; height: 300px; }
         
        .total-badge { 
            background: var(--accent-blue); color: white; padding: 12px 25px; 
            border-radius: 40px; font-size: 1.3em; font-weight: bold; margin-top: 15px;
        }

        /* --- FOOTER FOR TIMESTAMP --- */
        .footer-timestamp {
            position: absolute;
            bottom: 15px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #475569;
            font-size: 0.9em;
            font-weight: 500;
        }

        /* MEDIA QUERY: Optimierung für schmale Handys */
        @media (max-width: 500px) {
            body { padding: 10px; padding-bottom: 50px; }
            .card { flex: 1 1 100%; padding: 15px; margin-bottom: 20px; }
            .indicator-arrow { width: 80px; font-size: 0.9em; left: 60%; }
            .thermo-layout { height: 350px; }
            h2 { font-size: 1.4em; }
        }
    </style>
</head>
<body>

<!-- Karte 1: Thermometer -->
<div class="card">
    <h2>Bestand</h2>
    <div class="subtitle">Berlin</div>

    <div class="thermo-layout">
        <div class="scale">
            <span>0</span><span>5k</span><span>10k</span><span>15k</span><span>20k</span>
        </div>

        <div class="thermo-body">
            <div class="color-layers">
                <div style="height: 15%; background: #00b300;"></div>
                <div style="height: 15%; background: #00ff00;"></div>
                <div style="height: 20%; background: #ffff00;"></div>
                <div style="height: 20%; background: #ff9900;"></div>
                <div style="height: 30%; background: #cc0000;"></div>
            </div>
            <div class="thermo-gloss"></div>
            <div id="overlay" style="position: absolute; top: 0; width: 100%; background: #cbd5e1; transition: height 2s ease-in-out; z-index: 1;"></div>
        </div>

        <div id="pointer" class="indicator-arrow">13.450</div>
    </div>

    <div style="font-size: 2em; font-weight: bold; color: var(--danger-red); margin-top: 15px;">13.450</div>
    <p style="color: #64748b; font-weight: 600; margin: 5px 0;">Objektträger unbefundet</p>
</div>

<!-- Karte 2: Verlauf letzte Tage aus Google Sheets -->
<div class="card">
    <h2>Bestandsverlauf</h2>
    <div class="subtitle">Historie der letzten Tage</div>

    <div class="chart-container">
        <canvas id="historyChart"></canvas>
    </div>
</div>

<!-- Karte 3: Zusatz-Leistung -->
<div class="card">
    <h2>Zusatz-Leistung</h2>
    <div class="subtitle" id="kw-subtitle">Extra gescreente Präparate (KW --)</div>

    <div class="chart-container">
        <canvas id="extraChart"></canvas>
    </div>

    <div class="total-badge" id="total-sum">+ 0 gesamt</div>
</div>

<!-- Mittiger Zeitstempel am unteren Ende der Seite -->
<div class="footer-timestamp" id="live-timestamp">Letzte Aktualisierung: --.--.----, --:--:-- Uhr</div>

<script>
    const aktuellerBestand = 13450;
    const maxSkala = 20000;
    const zusatzLeistung = [30, 30, 20, 20, 20, 60, 0]; 

    // === GOOGLE SHEETS KONFIGURATION ===
    // Tragen Sie hier den Link zur als CSV veröffentlichten Google Sheet Datei ein.
    // Falls leer, werden Platzhalter-Daten geladen.
    const googleSheetCsvUrl = ' [https://docs.google.com/spreadsheets/d/e/2PACX-1vTLEqI47Xpfl0lGEPhE7Bu2V-Binn2wqlPg1Es7iolQCVGXz6kaloEwYIwxf8XeCnJgYz9d_rSUySOj/pub?gid=0&single=true&output=csv ] '; 
    
    // Platzhalterdaten, falls kein Google Sheet verbunden ist
    let historyLabels = ['Tag -5', 'Tag -4', 'Tag -3', 'Tag -2', 'Gestern', 'Heute'];
    let historyData = [12000, 12500, 14000, 13800, 13600, 13450];

    // Funktion zur Berechnung der ISO-Kalenderwoche
    function getISOWeek(date) {
        const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
        const dayNum = d.getUTCDay() || 7;
        d.setUTCDate(d.getUTCDate() + 4 - dayNum);
        const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
        return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
    }

    // Funktion um das Verlaufsdiagramm zu zeichnen
    function drawHistoryChart() {
        const ctxHistory = document.getElementById('historyChart').getContext('2d');
        new Chart(ctxHistory, {
            type: 'line',
            data: {
                labels: historyLabels,
                datasets: [{
                    label: 'Bestand',
                    data: historyData,
                    borderColor: 'var(--danger-red)',
                    backgroundColor: 'rgba(139, 0, 0, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.3, // Macht die Linie geschmeidig
                    pointBackgroundColor: 'var(--danger-red)',
                    pointRadius: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { 
                        beginAtZero: false,
                        grid: { color: '#e2e8f0' }
                    },
                    x: { grid: { display: false } }
                }
            }
        });
    }

    // Funktion um Daten aus Google Sheets (CSV) abzurufen
    async function fetchGoogleSheetsData() {
        if (googleSheetCsvUrl && googleSheetCsvUrl !== '') {
            try {
                const response = await fetch(googleSheetCsvUrl);
                const csvText = await response.text();
                
                const rows = csvText.split('\n').map(row => row.split(','));
                
                // Setzt voraus, dass Spalte 1 = Datum/Label und Spalte 2 = Wert ist
                // Die erste Zeile (Index 0) wird als Überschrift ignoriert
                const fetchedLabels = [];
                const fetchedData = [];

                for (let i = 1; i < rows.length; i++) {
                    if (rows[i].length >= 2 && rows[i][0].trim() !== '') {
                        fetchedLabels.push(rows[i][0].trim());
                        fetchedData.push(parseFloat(rows[i][1].trim()));
                    }
                }

                if (fetchedData.length > 0) {
                    historyLabels = fetchedLabels;
                    historyData = fetchedData;
                }
            } catch (error) {
                console.error("Fehler beim Laden des Google Sheets:", error);
            }
        }
        // Zeichne das Diagramm (entweder mit Google- oder Platzhalter-Daten)
        drawHistoryChart();
    }

    window.onload = function() {
        // 1. Aktuelle Kalenderwoche setzen
        const heute = new Date();
        const kw = getISOWeek(heute);
        document.getElementById('kw-subtitle').innerText = `Extra gescreente Präparate (KW ${kw})`;

        // 2. Zeitstempel der letzten Aktualisierung setzen
        const optionen = { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' };
        const zeitString = heute.toLocaleDateString('de-DE', optionen);
        document.getElementById('live-timestamp').innerText = `Letzte Aktualisierung: ${zeitString} Uhr`;

        // Thermometer Logik
        const prozent = (aktuellerBestand / maxSkala) * 100;
        document.getElementById('overlay').style.height = (100 - prozent) + '%';
        
        // Dynamische Positionierung des Pfeils basierend auf Containerhöhe
        const thermoHeight = document.querySelector('.thermo-layout').offsetHeight;
        document.getElementById('pointer').style.bottom = (prozent * (thermoHeight/100) - 20) + 'px';

        // Lade die Google Sheets Daten und zeichne das Verlaufs-Diagramm
        fetchGoogleSheetsData();

        // Bestehendes Balkendiagramm (Zusatz-Leistung)
        const ctxExtra = document.getElementById('extraChart').getContext('2d');
        new Chart(ctxExtra, {
            type: 'bar',
            data: {
                labels: ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'],
                datasets: [{
                    data: zusatzLeistung,
                    backgroundColor: '#3b82f6',
                    borderRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    y: { beginAtZero: true },
                    x: { grid: { display: false } }
                }
            }
        });

        const sum = zusatzLeistung.reduce((a, b) => a + b, 0);
        document.getElementById('total-sum').innerText = "+ " + sum.toLocaleString() + " gesamt";
    };
</script>

</body>
</html>
